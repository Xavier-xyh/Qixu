<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Qixu dashboard interface preview</title>
  <desc id="desc">Illustrative dashboard showing system metrics and workspace tools. This is not a captured application screenshot.</desc>
